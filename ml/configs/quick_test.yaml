# Quick Test Configuration for Development/Debugging

# Environment parameters
subject: "s03"
exercise: "band_pull_apart"
dataset-root: "train"
c: 5
m: 3
tol: 15

# Training parameters (minimal for quick testing)
total-timesteps: 5000
n-envs: 1
learning-rate: 0.001
n-steps: 64
batch-size: 16
n-epochs: 4
gamma: 0.95
gae-lambda: 0.9
clip-range: 0.3
ent-coef: 0.02
vf-coef: 0.8
max-grad-norm: 1.0

# Model parameters (smaller for quick training)
hidden-dim: 64
n-layers: 1

# Evaluation parameters
eval-freq: 1000
n-eval-episodes: 2

# Saving and logging
save-path: "./models/quick_test"
checkpoint-freq: 2000
log-interval: 1
use-wandb: false
tensorboard: false
