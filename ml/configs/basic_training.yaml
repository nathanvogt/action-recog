# Basic PPO Training Configuration for Rep Detection

# Environment parameters
subject: "s03"
exercise: "dumbbell_biceps_curls"
dataset-root: "train"
c: 24
m: 4
tol: 20

# Training parameters
total-timesteps: 10_000
n-envs: 2
learning-rate: 0.0003
n-steps: 256
batch-size: 16
n-epochs: 2
gamma: 0.99
gae-lambda: 0.98
clip-range: 0.5
ent-coef: 0.01
vf-coef: 0.75
max-grad-norm: 0.5

# Model parameters
hidden-dim: 32
n-layers: 2

# Evaluation parameters
eval-freq: 10_000
n-eval-episodes: 4 # used in training mode
n-eval-eps: 2 # used in evaluation mode
eval-subject: "s03"
eval-exercise: "dumbbell_biceps_curls"
eval-deterministic: false

# Saving and logging
supervised-path: "./models/supervised/rep_classifier.pt"
strict-supervised-loading: true # Fail if supervised loading doesn't work well
# load-path: "./models/basic_training/final_model.zip"
save-path: "./models/basic_training/fine_tuned"
# checkpoint-freq: 100_000
log-interval: 10
use-wandb: false
tensorboard: false
