# Basic PPO Training Configuration for Rep Detection

# Environment parameters
subject: "s03"
exercise: "band_pull_apart"
dataset-root: "train"
c: 16
m: 4
tol: 25

# Training parameters
total-timesteps: 1_000_000
n-envs: 2
learning-rate: 0.0003
n-steps: 256
batch-size: 4
n-epochs: 4
gamma: 0.99
gae-lambda: 0.98
clip-range: 0.2
ent-coef: 0.01
vf-coef: 0.5
max-grad-norm: 0.5

# Model parameters
hidden-dim: 64
n-layers: 1

# Evaluation parameters
eval-freq: 10_000
n-eval-episodes: 1 # used in training mode
n-eval-eps: 1 # used in evaluation mode
eval-subject: "s03"
eval-exercise: "band_pull_apart"

# Saving and logging
save-path: "./models/basic_training"
# checkpoint-freq: 50000
log-interval: 10
use-wandb: false
tensorboard: false
